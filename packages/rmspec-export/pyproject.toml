[project]
name = "rmspec-export"
version = "0.2.0"
description = "Writers for SVG, PNG and PDF, plus PDF page rasterization"
readme = "README.md"
authors = [
    { name = "Laith Al-Saadoon", email = "9553966+theagenticguy@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "rmspec-domain",
    "rmspec-render",
    "cairosvg>=2.8.2",
    "pillow>=12.1.1",
    "pymupdf>=1.27.1",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

# PEP 420 namespace: distribution rmspec-export ships the rmspec.export subpackage,
# so all nine members coexist under one `rmspec` namespace with no
# rmspec/__init__.py to fight over.
[tool.uv.build-backend]
module-name = "rmspec.export"
namespace = true

[tool.uv.sources]
rmspec-domain = { workspace = true }
rmspec-render = { workspace = true }
