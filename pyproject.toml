#  remarkable-spec workspace root.
#
#  This file is NOT a distribution. It is the uv workspace root and the single
#  home for tool configuration shared by every member package. Commands live in
#  mise.toml and nowhere else; lefthook.yml and .github/workflows/ci.yml both
#  call mise tasks so the three can never drift.

[project]
name = "remarkable-spec-workspace"
version = "0.2.0"
description = "Workspace root for remarkable-spec. Not published."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# Exact pins, not floors. Every gate runs through `uv run`, so mise, lefthook and
# CI resolve byte-identical tool versions. ty is 0.0.x -- a floor would let a
# patch release change what "the type gate" means between two machines.
[dependency-groups]
dev = [
    "ruff==0.16.5",
    "ty==0.0.66",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-testmon==2.2.0",
    "pytest-randomly==4.1.0",
    "hypothesis==6.165.10",
    "syrupy==6.0.0",
    "diff-cover==10.5.1",
]

# ─────────────────────────────── ruff ───────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["packages/*/src", "tests"]
# `src/remarkable_spec` used to be listed here too: the legacy single-distribution
# tree, excluded because linting code with a scheduled deletion date would have
# reported 626 findings nobody was going to fix. It was deleted on 2026-08-30, so
# the exclusion named a path that no longer exists -- a rule that can never fire
# reads like a live exemption and invites a new file to be dropped under it.
# Everything the workspace now ships is linted at full strength.
# ruff 0.16 formats Python code blocks embedded in Markdown. The docs/ tree is a
# generated artifact whose "Shape: verbatim from path:LOC" blocks are validated by
# string-equality against those exact source lines -- letting the formatter
# de-indent them silently breaks the verbatim claim. docs/ has its own gate
# (the citation validator), so ruff stays out of it entirely.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter owns these; enabling them fights `ruff format`.
    "COM812",  # missing trailing comma
    "ISC001",  # implicitly concatenated string on one line
    # Docstrings: we require them on public API (D1xx stay on) but not on every
    # dunder, nested function, or __init__.
    "D105",    # undocumented magic method
    "D107",    # undocumented __init__ -- documented on the class instead
    "D203",    # 1 blank line before class docstring (conflicts with D211)
    "D213",    # multi-line summary on second line (conflicts with D212)
    # We target one Python version and pin it in five places; a __future__
    # import is still wanted for cheap annotations, so keep FA but drop the
    # rule that objects to it.
    "TD002",   # missing author in TODO -- this repo has no TODOs by policy
    "TD003",   # missing issue link in TODO
    "FIX002",  # line contains TODO
    # Conflicts with the deliberate design: use cases take many collaborators
    # via DI, which reads as "too many arguments" to a linter with no DI model.
    "PLR0913", # too many arguments
    # A per-file copyright header on 60+ files, in a repo with a LICENSE at the
    # root and one author. Pure noise.
    "CPY001",  # missing copyright notice
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use magic values, and touch private members of the unit
# under test. They may also import sqlite3 to build fixtures for the
# persistence contract tests.
"tests/**" = ["S101", "PLR2004", "SLF001", "TID251", "D100", "D103", "D104", "ANN201", "INP001"]
"packages/*/tests/**" = ["S101", "PLR2004", "SLF001", "TID251", "D100", "D103", "D104", "ANN201", "INP001"]
# The one package allowed to speak SQL.
"packages/rmspec-persistence/**" = ["TID251"]
# The one package allowed to speak paramiko, which `banned-api` below bans everywhere and
# whose ban message already says so. Without this the lint layer contradicts the
# architecture layer: OWNED_THIRD_PARTY in tests/architecture/test_dependency_direction.py
# assigns paramiko to this package and fails the build if any *other* package imports it,
# while TID251 fails the build when this one does. Both transports live here, so the
# exemption is the package, not a file list that would drift as modules are added.
"packages/rmspec-device/**" = ["TID251"]
# The one package allowed to speak boto3 and botocore, for exactly the reason spelled out
# above for paramiko. `OWNED_THIRD_PARTY` already assigns both to this package -- it fails
# the build if any *other* package imports them -- while TID251 failed the build when this
# one did, so the two layers contradicted each other and rmspec-ocr could not be built at
# all. This is the third instance of that pattern, after sqlite3 and paramiko; the rule is
# that a `banned-api` entry naming an owner needs a matching per-package exemption, or the
# ban is not a boundary but a wall.
"packages/rmspec-ocr/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# TC003 wants a typing-only import moved into an `if TYPE_CHECKING:` block. For a name used
# in a pydantic field annotation that is wrong at runtime, not merely stylistic: pydantic
# resolves annotations when the model class is built, so the moved import makes the model
# raise `PydanticUserError: <Model> is not fully defined`. Declaring the base class here
# tells ruff those annotations are runtime-evaluated, so it stops demanding a move that
# breaks the model. Without it the only ways out are a `noqa` or giving the name a second
# runtime use -- and this repo allows neither shortcut, so the config is the real fix.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# The lint-level restatement of "no direct querying of DBs from application
# layers". sqlite3 is unimportable everywhere except rmspec-persistence and
# tests, both un-banned above.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "Go through a repository port from rmspec.domain.ports. Only rmspec-persistence may import sqlite3."
"boto3".msg = "Go through LlmPort or OcrPort. Only rmspec-ocr may import boto3."
"paramiko".msg = "Go through DevicePort. Only rmspec-device may import paramiko."

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["rmspec"]

# ─────────────────────────────── pytest ───────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
# `-m "not hardware"` belongs HERE and not only in the mise tasks. The comment below used
# to claim hardware tests never run unless explicitly selected, while `addopts` carried no
# marker filter at all -- so a bare `uv run pytest` collected all six of them and they
# failed against a detached tablet. Only `mise run check` passed the filter, so the
# guarantee held exactly where someone had already remembered it and nowhere else, which is
# the same shape as the `--cov` hole in tests/architecture/test_coverage_config.py: a rule
# documented in prose and enforced in one place.
#
# pytest's `-m` is single-valued and `addopts` is prepended, so a command-line `-m hardware`
# comes later and wins outright -- `mise run test-hardware` still selects exactly the
# hardware-marked set, whatever its size. It was six, then seven when the write precondition
# gained a read-only proof against the real page, then eight when the xochitl-restart guard
# gained one; a comment naming a count is a comment that goes stale, so this one names the
# marker instead.
# Verified both directions rather than assumed.
addopts = "--strict-markers --strict-config -ra -m 'not hardware'"
markers = [
    "hardware: requires an attached reMarkable tablet; deselected by default",
    "slow: excluded from the pre-commit fast lane",
]
# Nothing in the default run may touch the network, AWS, or the device.
filterwarnings = ["error"]

# ─────────────────────────────── coverage ───────────────────────────────

[tool.coverage.run]
branch = true
# `--cov` with no value does NOT discover unexecuted files from this `source`
# setting -- it silently reported 18 statements at 100% while 6,269 lines of
# brand-new untested source sat next to it. The mise tasks therefore pass
# `--cov=packages` explicitly; this stays as documentation of intent and for
# anyone invoking coverage directly.
source = ["packages"]
omit = ["*/tests/*", "*/__main__.py"]
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",           # Protocol method bodies
    "if __name__ == .__main__.:",
]
